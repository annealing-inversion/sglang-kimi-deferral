name: Publish Kimi Linear CUDA 13 Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "latest"
      base_image:
        description: "Base SGLang image"
        required: true
        default: "lmsysorg/sglang:latest-cu130-runtime"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/kimi-linear-cu13.Dockerfile
          push: true
          build-args: |
            SGLANG_BASE_IMAGE=${{ inputs.base_image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sglang-kimi-cu13:${{ inputs.tag }}
